name: CI
on:
  push:
  pull_request:
permissions:
  contents: read

env:
  LIVE_PROVIDER_TESTS: "1"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - run: node --test test/providers.live.test.js
