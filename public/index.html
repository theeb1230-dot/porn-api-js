<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>API Test Console</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}body{margin:0;background:#0b0d10;color:#f4f5f7}.wrap{max-width:920px;margin:auto;padding:24px}.card{background:#15191f;border:1px solid #2a3039;border-radius:18px;padding:18px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;border-radius:12px;border:1px solid #39414c;padding:12px;background:#0f1216;color:#fff}input{flex:1;min-width:180px}button{cursor:pointer;font-weight:700}.ok{color:#66e38c}.bad{color:#ff7b7b}.item{padding:12px 0;border-top:1px solid #2a3039}.item:first-child{border-top:0}.muted{color:#9ba5b2}pre{white-space:pre-wrap;word-break:break-word;background:#090b0e;padding:12px;border-radius:12px;max-height:340px;overflow:auto}a{color:#9fc5ff}</style></head>
<body><main class="wrap"><h1>API Test Console</h1><p class="muted">A small technical console for checking provider search, details and source availability without manually assembling URLs.</p>
<section class="card"><div class="row"><button id="health">Check API health</button><strong id="healthState" class="muted">Not checked</strong></div></section>
<section class="card"><div class="row"><select id="provider"><option value="eporner">Provider A</option><option value="xhamster">Provider B</option></select><input id="query" placeholder="Search query" autocomplete="off"><button id="search">Search</button></div><p id="status" class="muted">Ready</p><div id="results"></div></section>
<section class="card"><h2>Selected result</h2><div id="details" class="muted">Choose a result to inspect its technical details and available source qualities.</div></section>
<section class="card"><details><summary>Raw API response</summary><pre id="raw">No response yet.</pre></details></section>
</main><script>
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path){const r=await fetch(path);const j=await r.json().catch(()=>({}));$("raw").textContent=JSON.stringify(j,null,2);if(!r.ok)throw new Error(j.error||("HTTP "+r.status));return j}
$("health").onclick=async()=>{try{const j=await api("/health");$("healthState").textContent=j.status==="ok"?"Online":"Unexpected response";$("healthState").className=j.status==="ok"?"ok":"bad"}catch(e){$("healthState").textContent=e.message;$("healthState").className="bad"}};
$("search").onclick=async()=>{const q=$("query").value.trim();if(!q)return;$("status").textContent="Searching…";$("results").innerHTML="";try{const p=$("provider").value,j=await api("/api/"+p+"/search/"+encodeURIComponent(q));const rows=Array.isArray(j.data)?j.data:[];$("status").textContent=rows.length?rows.length+" results returned":"No results";$("results").innerHTML=rows.slice(0,30).map((v,i)=>'<div class="item"><button data-i="'+i+'">Inspect result '+(i+1)+'</button> <span class="muted">ID: '+esc(v.id)+'</span></div>').join("");$("results").querySelectorAll("button").forEach(b=>b.onclick=()=>inspect(p,rows[Number(b.dataset.i)].id))}catch(e){$("status").textContent=e.message;$("status").className="bad"}};
async function inspect(p,id){$("details").textContent="Loading details…";try{const j=await api("/api/"+p+"/details/"+encodeURIComponent(id)),d=j.data||{},src=Array.isArray(d.sources)?d.sources:Object.values(d.sources||{});$("details").innerHTML='<p><strong>ID:</strong> '+esc(d.id||id)+'</p><p><strong>Duration:</strong> '+esc(d.duration||"n/a")+'</p><p><strong>Rating:</strong> '+esc(d.rating||"n/a")+'</p><p><strong>Available sources:</strong> '+src.length+'</p>'+src.map((s,i)=>'<div class="item">Source '+(i+1)+' · '+esc(s.quality||s.label||"unknown quality")+'</div>').join("")}catch(e){$("details").textContent=e.message;$("details").className="bad"}}
</script></body></html>
